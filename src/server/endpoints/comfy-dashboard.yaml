openapi: 3.0.3
info:
  title: ComfyUI Dashboard API
  description: >-
    API for managing ComfyUI workflows and cloud pod management. Provides
    CRUD for workflows, generation snapshots, a unified endpoint for
    spawning/checking Beam cloud pods, and persistent direct ComfyUI
    connections. Prompt processing happens
    server-side: POST /v1/comfy/cloud/prompt (with workflow_id +
    generation_id) consumes the pod's NDJSON stream in the background and
    keeps the generation json updated — clients poll
    GET /v1/comfy/workflows/{id}/generate for progress instead of
    streaming. Result media (images/videos/audio) is persisted on disk as
    plain asset files and served per item from
    GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index},
    which 302-redirects to the static /v1/comfy/media mount (streamed off
    disk with byte-range support) — usable directly in <img>/<video>/<audio>
    tags, and the generation json only carries small file references.
    Multiple generations may be queued on the same pod
    concurrently; each submission is scoped by its own client_id so only
    its job's events land in its generation json.
  version: 0.8.0
servers:
  - url: http://127.0.0.1:8188
    description: Local ComfyUI server
  - url: https://comfy-spawner.beam.cloud
    description: Beam ComfyUI spawner (Tier 1 — used by POST /v1/comfy/cloud)
tags:
  - name: Workflows
    description: CRUD for ComfyUI workflows
  - name: Cloud
    description: Beam cloud pod management — spawn pods and check pod status
  - name: Connect
    description: Managed ComfyUI server connections and per-prompt event logs
paths:
  # ── Workflows ──────────────────────────────────────────────────────

  /v1/comfy/workflows:
    get:
      operationId: listWorkflows
      summary: List all workflows
      description: >-
        Returns stored workflow metadata, optionally filtered by search query
        (matches name, description, or tags). Each entry includes id, name,
        description, nodeCount, timestamps, tags, and inputFields (the
        workflow's declared Input markings). Sorted by modifiedDate
        descending (most recently modified first).
      tags:
        - Workflows
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Free-text search query. Matches against workflow name, description,
            and tags (case-insensitive substring match).
          schema:
            type: string
      responses:
        '200':
          description: List of all workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
              example:
                workflows:
                  - id: wf-001
                    name: Text-to-Image Basic
                    description: Simple txt2img workflow
                    nodeCount: 8
                    createdDate: '2026-07-01T10:00:00.000Z'
                    modifiedDate: '2026-07-01T10:00:00.000Z'
                    tags: [txt2img, basic]
                    inputFields: ['3:data_uri']
    post:
      operationId: createWorkflow
      summary: Create a new workflow
      description: >-
        Uploads a new ComfyUI workflow. Accepts the workflow name, optional
        description, and the raw ComfyUI workflow JSON. Extracts node
        information and stores the workflow.
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '200':
          description: Workflow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkflowResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Get a specific workflow
      description: >-
        Returns the full workflow including all nodes and the raw ComfyUI JSON.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateWorkflow
      summary: Update a workflow
      description: >-
        Partially updates an existing workflow. Accepts any combination of
        name, description, and raw workflow JSON. Only provided fields are
        updated; omitted fields retain their current values.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowRequest'
      responses:
        '200':
          description: Workflow updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow
      description: Permanently removes a workflow and all its data.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}/generate:
    get:
      operationId: listGenerations
      summary: List generations for a workflow
      description: >-
        Returns lightweight summaries of all generation snapshots for the
        given workflow, sorted by createdDate descending (newest first).
        Each summary omits the heavy prompt (full workflow JSON) and result
        payloads (image/video data: URLs, often megabytes of base64) so the
        list loads fast. Each summary includes a resultCount and
        resultItems (per-result metadata without payloads) so callers can
        render "N items" and stream previews straight from
        GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}
        without fetching the full entry.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of generation summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationListResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: generateWorkflow
      summary: Generate a workflow snapshot
      description: >-
        Creates a generation snapshot and stores it in a "generation"
        subfolder inside the workflow's directory as a JSON file with
        metadata (status, createdDate, etc.). The event progression of the
        subsequent run lives in the sibling .log file, not in the json.
        The snapshotted `prompt` is the optional request body's prompt
        when provided — the UI sends its serialized ORIGINAL workflow json
        (v0.4/v1 editor format, with every edit), so the generation
        captures exactly the document visible at click time, lossless.
        Without a body, the workflow's stored workflow.json is snapshotted
        instead. Submissions to a Comfy Cloud pod convert the stored
        document to the flat API prompt server-side at submission time.
        The generation's id (the file base name) comes from the optional
        request body `name`, sanitized to a safe file name; when omitted,
        a timestamped default (YYYYMMDD-HHMMSS) is used.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: object
                  additionalProperties: true
                  description: >-
                    Optional. The ORIGINAL workflow json to snapshot instead
                    of the stored workflow.json — the v0.4/v1 editor-format
                    document ({"version", "nodes", "links", ...}) built from
                    the caller's current edited state, kept lossless.
                    Consumers submitting to a Comfy Cloud pod convert it to
                    the flat API prompt server-side at submission time.
                name:
                  type: string
                  description: >-
                    Optional. Name for the new generation — used as its id
                    (the generation json/log file base name) after
                    sanitizing filename-unsafe characters. When omitted,
                    the timestamped default (YYYYMMDD-HHMMSS) is used.
                    The dashboard UI defaults to "<workflow name>_<local
                    timestamp>". Collisions get a -01, -02, ... suffix.
            examples:
              editor_snapshot:
                summary: Snapshot the caller's edited workflow json
                value:
                  name: SDXL Poster_20260731-143022
                  prompt:
                    version: 1
                    nodes:
                      - id: 4
                        type: CheckpointLoaderSimple
                        pos: [0, 0]
                        widgets_values: [sd_xl_base_1.0.safetensors]
                      - id: 3
                        type: KSampler
                        pos: [300, 0]
                        widgets_values: [123456789012345, randomize, 20, 8, euler, normal, 1]
                        inputs:
                          - name: model
                            type: MODEL
                            link: 1
                    links:
                      - id: 1
                        origin_id: 4
                        origin_slot: 0
                        target_id: 3
                        target_slot: 0
                        type: MODEL
      responses:
        '200':
          description: Generation file created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}/generate/{generate_id}:
    get:
      operationId: getGeneration
      summary: Get a single generation (full data)
      description: >-
        Returns the complete generation entry for the given workflow and
        generate_id, including the snapshotted prompt and the result
        references (`file:` asset urls — legacy inline-base64 entries are
        migrated to files on read, never handed out as payloads). The list
        endpoint
        (GET /v1/comfy/workflows/{id}/generate) returns only lightweight
        summaries (no prompt, no result references) for fast loading, so the
        full entry must be fetched on demand per generation — typically only
        when the snapshotted prompt is needed, since result media serves
        via
        GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: generate_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The full generation entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateWorkflowResponse'
        '404':
          description: Generation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateGeneration
      summary: Update a generation entry
      description: >-
        Partially updates a generation snapshot. Used by the agent to report
        results (images, videos), mark completion status, and record timing.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: generate_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGenerationRequest'
      responses:
        '200':
          description: Generation updated successfully
          content:
            application/json:
                schema:
                  $ref: '#/components/schemas/GenerateWorkflowResponse'
        '404':
          description: Generation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteGeneration
      summary: Delete a generation snapshot
      description: >-
        Permanently removes a generation snapshot: the json record, its
        sibling .log event trail, and its media assets folder
        (`generation/{generate_id}/`). Note that deleting a still-pending or
        processing generation does NOT cancel its execution on the pod —
        the server's background stream consumer simply stops updating the
        (now missing) file.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: generate_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Generation deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGenerationResponse'
        '404':
          description: Generation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}:
    get:
      operationId: getGenerationResult
      summary: Serve a single generation result (image/video/audio)
      description: >-
        Serves one result item of a generation with its real Content-Type, so
        the URL can be used directly as
        `<img src="...">`, `<video src="...">`, or `<audio src="...">` —
        clients never need to pull the full generation entry just to preview
        an output.

        Behavior depends on how the result was persisted
        (see GenerationResultItem.url):
        - **`file:` reference** (current storage — the payload lives as a
          plain file in the generation's assets folder,
          `generation/{generate_id}/{index}.{ext}`) — answered with a `302`
          redirect (root-relative Location) to the static `/v1/comfy/media`
          mount, which streams the file off disk: `Accept-Ranges: bytes`
          advertised and `Range: bytes=start-end` honored (206 Partial
          Content), which some browsers (e.g. Safari) require before they
          will play `<video>` at all, and which enables seeking on large
          payloads. The endpoint itself never reads the bytes. The
          root-relative redirect resolves against whatever origin the client
          reached the server by (localhost, LAN IP, hostname), so the same
          generation json serves every interface.
        - **`data:` URL** (base64 payload, from generations written before
          file-backed storage) — MIGRATED on first read: decoded once,
          written to an asset file, and the generation json rewritten with
          a `file:` reference; the request is then answered with the same
          media-mount redirect. A decode-and-stream path (with the range
          behavior above) remains only as the fallback for the case where
          the asset write fails — nothing keeps serving base64 long-term.
        - **Remote http(s) URL** — answered with a `302` redirect so the
          upstream server delivers the bytes directly.

        The lightweight `resultItems` array on GenerationSummary entries
        (GET /v1/comfy/workflows/{id}/generate) carries the per-result
        metadata (type, mimeType, size, nodeId) — everything this endpoint
        needs except the payload itself — so a UI can build these URLs as
        `/result/0`, `/result/1`, ... straight from the summary list without
        any extra fetch.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: generate_id
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          description: Zero-based position of the result within the generation's `result` array.
          schema:
            type: integer
            minimum: 0
        - name: Range
          in: header
          required: false
          description: >-
            Optional byte range (e.g. `bytes=0-1023`) — served as 206 Partial
            Content for data:-backed results; for file-backed results the
            browser re-sends it to the /v1/comfy/media mount after the
            redirect, which honors it there.
          schema:
            type: string
      responses:
        '200':
          description: The result payload (full body).
          headers:
            Content-Type:
              description: The stored mimeType of the result (e.g. image/png, video/mp4).
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Cache-Control:
              schema:
                type: string
                example: private, max-age=3600
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content for a successful Range request.
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes 0-1023/2048576
            Content-Length:
              schema:
                type: integer
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
        '302':
          description: >-
            The result is file-backed (root-relative redirect to the static
            /v1/comfy/media mount, which streams the file off disk) or a
            remote URL (redirect to it, so the upstream server delivers the
            bytes). Followed transparently inside <img>/<video>/<audio>.
        '400':
          description: Missing/invalid path parameter (index not a non-negative integer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Generation not found, or index out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: Range cannot be satisfied
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes */2048576
        '422':
          description: Result payload is not servable (unsupported url format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}/generate/{generate_id}/log:
    get:
      operationId: getGenerationLog
      summary: Get a generation's .log event trail
      description: >-
        Returns the timestamped .log file written next to the generation
        json by POST /v1/comfy/cloud/prompt while it consumes the pod's
        NDJSON stream server-side — the chronological trail of status
        changes and per-event summaries (submission, enqueue, progress,
        captured results, terminal error). Intended for DEBUGGING failed
        runs: the dashboard's OUTPUT tab opens this from failed/error
        generations (a failed run, or a "completed" run that produced no
        output) in a read-only dialog with a Copy button.

        Generations without a .log file (written outside the cloud prompt
        endpoint, or predating the .log trail) get a trail SYNTHESIZED from
        the generation json itself (creation, final status, timing, error
        message), so the response always carries something meaningful.
        Logs larger than 256 KB are tail-truncated with a notice prepended
        — the recent lines are the ones carrying the terminal error.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: generate_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The generation's log trail (plain text in a json envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationLogResponse'
        '400':
          description: Missing path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Generation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Cloud ──────────────────────────────────────────────────────────

  /v1/comfy/cloud:
    post:
      operationId: cloudPod
      summary: Create a cloud pod or check pod status
      description: >-
        Dual-purpose endpoint for Beam cloud pod management:

        **Create a pod** — Send an empty body `{}` or `{"name": "my-pod"}`.
        Sends a GET to the Beam spawner URL which returns a 302 redirect to
        the spawned pod's public proxy URL. The pod runs ComfyUI with a
        FastAPI proxy on its public port and scales to zero ~120s after the
        last active connection.

        **Check pod status** — Send `{"pod_url": "<pod_url>"}`. Probes the
        Tier 2 proxy of an existing pod and returns its health, system stats,
        and available models. Use this to verify a pod is ready before
        submitting prompts.
      tags:
        - Cloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPodRequest'
            examples:
              create_pod:
                summary: Spawn a new pod
                value: {}
              create_named_pod:
                summary: Spawn a pod with a custom name
                value:
                  name: my-comfy-pod
              check_status:
                summary: Check the status of an existing pod
                value:
                  pod_url: "https://test-pod-abc123.beam.cloud:8188"
      responses:
        '200':
          description: >-
            Pod created or status returned successfully.
            The response shape depends on the request:
              - **Create**: `{ pod_url }`
            - **Status**: `{ health, models_dir, models }`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CloudCreateResponse'
                  - $ref: '#/components/schemas/CloudPodStatusResponse'
              examples:
                create_result:
                  summary: Pod created successfully
                  value:
                    pod_url: "https://test-pod-abc123.beam.cloud:8188"
                status_result:
                  summary: Pod status returned
                  value:
                    health:
                      healthy: true
                      system_stats:
                        system:
                          os: linux
                          ram_total: 25728937984
                          ram_free: 20000000000
                          comfyui_version: "0.3.27"
                          python_version: "3.10.12"
                          pytorch_version: "2.5.1+cu130"
                        devices:
                          - name: "NVIDIA GeForce RTX 4090"
                            type: cuda
                            index: 0
                            vram_total: 25769803776
                            vram_free: 25600000000
                    models_dir: /ComfyUI/models
                    models:
                      checkpoints:
                        - sd_xl_base_1.0.safetensors
                      loras:
                        - wan/lightning_4steps.safetensors
                      vae:
                        - sdxl_vae.safetensors
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Spawner unavailable, pod creation failed, or pod unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/cloud/prompt:
    post:
      operationId: cloudPrompt
      summary: Submit a prompt to a spawned pod — server-side processing (202) or NDJSON proxy stream (200)
      description: >-
        Two modes:

        **Server-side processing** — include `workflow_id` and
        `generation_id` in the body. The server forwards the prompt to
        `POST <pod_url>/` on the Tier 2 ComfyProxy endpoint, consumes the
        resulting NDJSON event stream in the background, and keeps the
        generation json updated by itself (status → processing/completed/
        failed, results, timing — the same file written by
        /v1/comfy/workflows/{id}/generate). The event progression itself is
        traced into the sibling .log file — it is intentionally NOT stored
        in the generation json. Returns 202 immediately;
        clients poll GET /v1/comfy/workflows/{id}/generate for progress.

        **Legacy proxy mode** — no workflow reference. Streams the pod's
        results back as `application/x-ndjson` — one JSON object per line.
        The connection stays open while ComfyUI executes the prompt; each
        WS event is forwarded as an NDJSON line. **Clients must read the
        response body as a stream**, parsing one JSON document per line,
        until they receive:
        - `{"type":"proxy_done","data":{}}` — run completed normally, or
        - `{"type":"execution_error",...}` / `{"type":"proxy_error",...}` — failure.
      tags:
        - Cloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPromptRequest'
            examples:
              basic_prompt:
                summary: Legacy proxy mode — client reads the NDJSON stream
                value:
                  pod_url: "https://test-pod-abc123.beam.cloud:8188"
                  prompt:
                    "3":
                      class_type: KSampler
                      inputs:
                        seed: 123456789012345
                        steps: 20
                        cfg: 8
                        sampler_name: euler
                        scheduler: normal
                        denoise: 1
                        model: ["4", 0]
                        positive: ["6", 0]
                        negative: ["7", 0]
                        latent_image: ["5", 0]
                    "4":
                      class_type: CheckpointLoaderSimple
                      inputs:
                        ckpt_name: sd_xl_base_1.0.safetensors
                  client_id: "abc123def4567890fedcba0987654321"
              server_side_processing:
                summary: Server-side mode — server consumes the stream, poll the generation for progress
                value:
                  pod_url: "https://test-pod-abc123.beam.cloud:8188"
                  prompt:
                    "3":
                      class_type: KSampler
                      inputs:
                        seed: 123456789012345
                        steps: 20
                        cfg: 8
                        sampler_name: euler
                        scheduler: normal
                        denoise: 1
                        model: ["4", 0]
                        positive: ["6", 0]
                        negative: ["7", 0]
                        latent_image: ["5", 0]
                    "4":
                      class_type: CheckpointLoaderSimple
                      inputs:
                        ckpt_name: sd_xl_base_1.0.safetensors
                  workflow_id: "20260729-101530"
                  generation_id: "20260729-101545"
                  extra_data:
                    workflow_id: "20260729-101530"
                    generation_id: "20260729-101545"
      responses:
        '202':
          description: >-
            Accepted for server-side processing (workflow_id and
            generation_id were provided). The server consumes the pod's
            NDJSON stream in the background and updates the generation
            json file itself (the raw events are traced into the sibling
            .log file, not into the json). There is no response stream —
            poll GET /v1/comfy/workflows/{id}/generate for progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    example: true
                  workflow_id:
                    type: string
                  generation_id:
                    type: string
                  client_id:
                    type: string
                    description: >-
                      The 32-char hex client_id this submission was scoped
                      with (generated by the server when not provided).
                      Every generation queued on the same pod gets its own.
                    example: abc123def4567890fedcba0987654321
                required: [accepted, workflow_id, generation_id, client_id]
        '200':
          description: >-
            Chunked NDJSON stream of progress events from the ComfyUI pod
            (legacy proxy mode — no workflow reference provided).
            See beam_comfy_service.yaml ProxyStreamEvent for the full event
            vocabulary (proxy_enqueue, progress, executing, executed,
            execution_success, execution_error, proxy_done, etc.).
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/CloudStreamEvent'
              examples:
                happy_path:
                  summary: A successful txt2img run
                  value: |
                    {"type":"proxy_enqueue","data":{"prompt_id":"f0c...","number":1,"node_errors":{}}}
                    {"type":"status","data":{"status":{"queue_running":[],"queue_pending":[]},"sid":"abc..."}}
                    {"type":"execution_start","data":{"prompt_id":"f0c..."}}
                    {"type":"progress","data":{"value":1,"max":20,"prompt_id":"f0c...","node":"3"}}
                    {"type":"progress","data":{"value":20,"max":20,"prompt_id":"f0c...","node":"3"}}
                    {"type":"executing","data":{"node":"8","prompt_id":"f0c..."}}
                    {"type":"executed","data":{"node":"9","output":{"images":[{"filename":"ComfyUI_00001_.png","subfolder":"","type":"output"}]},"prompt_id":"f0c..."}}
                    {"type":"executing","data":{"node":null,"prompt_id":"f0c..."}}
                    {"type":"execution_success","data":{"prompt_id":"f0c..."}}
                    {"type":"proxy_done","data":{}}
        '400':
          description: Invalid request (missing prompt, invalid pod_url)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            Server misconfigured (server-side processing requested without
            a project root for the generation file store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Pod unreachable or proxy error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Direct persistent connections ───────────────────────────────────

  /v1/comfy/connect:
    post:
      operationId: connectComfyServer
      summary: Establish a managed ComfyUI server connection
      description: >-
        Picks a ComfyUI server from the server's configured list
        (auto-start endpoints — contacting one cold-boots its ComfyUI),
        polls the server's native GET /system_stats until ComfyUI has
        finished starting, then opens a native websocket at
        `<pod_url>/ws?clientId=<client_id>` and keeps it open in the
        background. Only after the server is confirmed up does the response
        return the connect_id (uuid).

        Without a body (or `{}`), candidates are tried in round-robin order
        across the whole list: each server gets one startup window before
        the next is tried. Sending `{"server": "<name>"}` pins the
        connection to a specific list entry.

        From this moment until the ComfyUI server terminates, the server
        records EVERY websocket message to disk: messages carrying
        `data.prompt_id` land in
        `<root>/connect/<connect_id>/<prompt_id>.json`; messages without one
        (status broadcasts, binary preview frames) are attributed to the
        prompt currently in flight, or to the connection's session log when
        no prompt is active yet. The returned connect_id submits prompts and
        reads the resulting per-prompt logs.
      tags:
        - Connect
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
            examples:
              any_server:
                summary: Pick any server from the list (round-robin)
                value: {}
              named_server:
                summary: Pin a specific server from the list
                value:
                  server: devonshire2
      responses:
        '200':
          description: ComfyUI server started and persistent connection established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResponse'
        '400':
          description: Unknown server name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: No ComfyUI servers configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: No server in the list started within its window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/connect/{connect_id}:
    post:
      operationId: sendConnectedComfyPrompt
      summary: Send a native prompt through a managed connection
      description: >-
        Opens or reuses the websocket subscription for client_id, then sends
        the prompt to the connected server's native POST /prompt endpoint.
        The response is ComfyUI's native prompt response (prompt_id, number,
        node_errors) with connect_id and client_id appended. The prompt's
        websocket event log (`<root>/connect/<connect_id>/<prompt_id>.json`)
        is created as soon as ComfyUI assigns the prompt_id.
      tags:
        - Connect
      parameters:
        - name: connect_id
          in: path
          required: true
          schema:
            type: string
          description: Identifier returned by POST /v1/comfy/connect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectPromptRequest'
            example:
              prompt:
                '3':
                  class_type: KSampler
                  inputs:
                    seed: 123456789012345
                    steps: 20
              client_id: abc123def4567890fedcba0987654321
      responses:
        '200':
          description: Native ComfyUI prompt response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectPromptResponse'
        '400':
          description: Invalid connect_id, prompt, or client_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: connect_id is not active in this server process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The server websocket or prompt endpoint could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/connect/{connect_id}/{prompt_id}:
    get:
      operationId: getConnectedPromptLog
      summary: Read one prompt's recorded websocket event list
      description: >-
        Returns the streaming list of websocket data recorded for one
        prompt_id. The file is stored at
        `<root>/connect/<connect_id>/<prompt_id>.json`, so the whole event
        trail remains readable after the live websocket has closed and even
        after the ComfyUI server has terminated.

        **JSON snapshot (default)** — the full recorded event list so far;
        poll this for progress.

        **Live stream** — pass `?stream=true` to receive a Server-Sent
        Events stream instead: the recorded history is replayed first, then
        each new event appended by the websocket recorder is pushed live.
        The stream ends after the prompt's terminal event
        (execution_success / execution_error / execution_interrupted).
      tags:
        - Connect
      parameters:
        - name: connect_id
          in: path
          required: true
          schema:
            type: string
        - name: prompt_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The prompt_id returned by POST /v1/comfy/connect/{connect_id}
            (or `session` for the connection-wide catch-all log).
        - name: stream
          in: query
          required: false
          description: 'true (or 1) switches the response to a live SSE stream.'
          schema:
            type: string
            enum: ['true', '1']
      responses:
        '200':
          description: >-
            The prompt's recorded event list — JSON snapshot by default,
            text/event-stream when `?stream=true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectPromptLog'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ConnectLogEvent'
        '400':
          description: Missing or invalid path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Prompt log file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# =============================================================================
#  COMPONENTS
# =============================================================================
components:
  schemas:

    # ── Workflows ──────────────────────────────────────────────────

    WorkflowMeta:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        nodeCount:
          type: integer
        createdDate:
          type: string
        modifiedDate:
          type: string
        tags:
          type: array
          items:
            type: string
        inputFields:
          type: array
          items:
            type: string
          description: >-
            Widget keys ("<nodeId>:<inputName>") marked as workflow Inputs
            in the dashboard's PROMPT tab (mirrored from the workflow
            json's extra.inputFields). Workflows with a non-empty list
            appear in the result preview's workflow dropdown — picking one
            feeds the viewed image's base64 data stream into the marked
            Data URI (Universal Data Input) fields and triggers a run.

    Workflow:
      allOf:
        - $ref: '#/components/schemas/WorkflowMeta'
        - type: object
          properties:
            nodes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  position:
                    type: object
                    properties:
                      x:
                        type: number
                      y:
                        type: number
                  inputs:
                    type: object
            raw:
              type: object
              description: The raw ComfyUI workflow JSON

    CreateWorkflowRequest:
      type: object
      required:
        - name
        - raw
      properties:
        name:
          type: string
        description:
          type: string
        raw:
          type: object
          description: The raw ComfyUI workflow JSON

    CreateWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowMeta'

    GetWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'

    DeleteWorkflowResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: string

    DeleteGenerationResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: string
          description: Id of the deleted generation.

    UpdateWorkflowRequest:
      type: object
      description: >-
        Partial update for an existing workflow. Only include fields that
        should change; omitted fields retain their current values.
      properties:
        name:
          type: string
          description: New name for the workflow.
        description:
          type: string
          description: New description for the workflow.
        raw:
          type: object
          description: >-
            Updated raw ComfyUI workflow JSON. When provided, the node list
            and nodeCount are re-extracted from this object.
        tags:
          type: array
          items:
            type: string
          description: Replacement tag list.

    UpdateWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'

    WorkflowListResponse:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMeta'

    GenerateWorkflowResponse:
      type: object
      description: Response from creating a generation snapshot.
      properties:
        generation:
          $ref: '#/components/schemas/GenerationEntry'
      required: [generation]

    GenerationListResponse:
      type: object
      description: >-
        Lightweight summaries of generation snapshots for a workflow. The
        list endpoint returns summaries (no prompt, no result payloads) so
        it loads fast; fetch the full entry via
        GET /v1/comfy/workflows/{id}/generate/{generate_id} when needed.
      properties:
        generations:
          type: array
          items:
            $ref: '#/components/schemas/GenerationSummary'

    GenerationSummary:
      type: object
      description: >-
        Lightweight summary of a generation entry — what the list endpoint
        (GET /v1/comfy/workflows/{id}/generate) returns. Excludes the heavy
        prompt (full workflow JSON) and result payloads (image/video data:
        URLs, often megabytes of base64) so the list stays small. The
        resultItems metadata lets clients preview outputs via
        GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}
        (streamable binary — usable directly in <img>/<video>) without
        fetching the full entry; the full prompt remains available via
        GET /v1/comfy/workflows/{id}/generate/{generate_id}.
      properties:
        id:
          type: string
          description: Generation identifier (timestamp-based filename without .json)
          example: "20260728-153045"
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Current status of the generation
        createdDate:
          type: string
          format: date-time
          description: ISO timestamp when the generation was created
        completedDate:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp when the generation completed (null if pending)
        generatedTime:
          type: string
          nullable: true
          description: Human-readable generation duration (e.g. "12.5s")
        error:
          type: string
          nullable: true
          description: Error message if the generation failed
        resultCount:
          type: integer
          description: >-
            Number of result items (images/videos) in the full entry. Lets
            callers render "N items" without the result payloads themselves.
        resultItems:
          type: array
          description: >-
            Lightweight per-result metadata — everything except the heavy
            `url` payload (type, mimeType, size, nodeId). Lets a UI pick
            <img> vs <video> and build streaming URLs directly:
            GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}.
          items:
            $ref: '#/components/schemas/GenerationResultMeta'
      required:
        - id
        - status
        - createdDate
        - completedDate
        - generatedTime
        - error
        - resultCount
        - resultItems

    UpdateGenerationRequest:
      type: object
      description: >-
        Partial update for a generation entry. Only include fields that
        should change; omitted fields retain their current values.
      properties:
        status:
          type: string
          enum: [pending, processing, completed, failed]
        result:
          type: array
          items:
            $ref: '#/components/schemas/GenerationResultItem'
        generatedTime:
          type: string
          nullable: true
          description: Human-readable generation duration (e.g. "12.5s")
        completedDate:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true

    GenerationEntry:
      type: object
      description: >-
        A generation snapshot. Contains the workflow prompt and metadata
        tracking its status. Returned in full by POST /v1/comfy/workflows/{id}/generate
        (on creation), GET /v1/comfy/workflows/{id}/generate/{generate_id}
        (single-entry fetch), and PUT .../generate/{generate_id} (update).
        The list endpoint (GET /v1/comfy/workflows/{id}/generate) returns
        lightweight GenerationSummary entries instead.
      properties:
        id:
          type: string
          description: Generation identifier (timestamp-based filename without .json)
          example: "20260728-153045"
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Current status of the generation
        createdDate:
          type: string
          format: date-time
          description: ISO timestamp when the generation was created
        completedDate:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp when the generation completed (null if pending)
        generatedTime:
          type: string
          nullable: true
          description: Human-readable generation duration (e.g. "12.5s")
        error:
          type: string
          nullable: true
          description: Error message if the generation failed
        prompt:
          type: object
          description: >-
            The ORIGINAL workflow json snapshot (v0.4/v1 editor format — the
            lossless document: positions, links, widget values, groups).
            Converted to the flat API prompt server-side when submitted to
            a Comfy Cloud pod, and the verbatim copy source for
            "create a workflow from this generation".
        result:
          type: array
          description: Array of generated outputs (images, videos, etc.)
          items:
            $ref: '#/components/schemas/GenerationResultItem'
          # The raw NDJSON event progression of a run is intentionally NOT
          # stored in the generation json — the server writes a timestamped
          # .log file next to the json with a line per status change and per
          # streamed event, which is sufficient to understand the run.
          # All fields are always present in responses — the server
          # normalizes older files on read (nullable fields read as null,
          # arrays as []).
      required:
        - id
        - status
        - createdDate
        - completedDate
        - generatedTime
        - error
        - prompt
        - result

    GenerationResultItem:
      type: object
      description: A single result from a generation (image, video, or audio).
      properties:
        type:
          type: string
          enum: [image, video, audio]
        url:
          type: string
          description: >-
            Persisted location of the result. Shapes:
            - `file:<index>.<ext>` (the only shape stored going forward) —
              the payload is a plain file in the generation's assets folder
              (`generation/{generate_id}/`); the json carries only this
              small reference. Serve it via
              GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index},
              which 302-redirects to the static /v1/comfy/media mount.
              Host-relative by design: no server address is baked in, so the
              same json works on localhost and over the LAN alike.
            - `data:` URL (base64, legacy generations — migrated to `file:`
              on first read: the bytes are moved to an asset file and the
              json rewritten).
            - Remote http(s) URL.
            Blob URLs are intentionally never stored: they die with the page
            session. Viewers never convert payloads into throwaway blob
            URLs — they consume the result endpoint directly as
            <img src> / <video src> / <audio src>.
        mimeType:
          type: string
          example: "image/png"
        size:
          type: integer
          description: Size in bytes
        nodeId:
          type: string
          description: The workflow node that produced this result
      required: [type, url, mimeType, size, nodeId]

    GenerationResultMeta:
      type: object
      description: >-
        A GenerationResultItem WITHOUT its `url` field — the display
        metadata carried by GenerationSummary entries so clients can label
        results and build serving URLs without pulling the payload.
        The media is served by
        GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}.
      properties:
        type:
          type: string
          enum: [image, video, audio]
        mimeType:
          type: string
          example: "image/png"
        size:
          type: integer
          description: Size in bytes
        nodeId:
          type: string
          description: The workflow node that produced this result
      required: [type, mimeType, size, nodeId]

    GenerationLogResponse:
      type: object
      description: >-
        A generation's .log event trail — the timestamped text the cloud
        prompt endpoint writes next to the generation json while processing
        the run. Synthesized from the generation json when no .log file
        exists; tail-truncated at 256 KB (with a notice) when oversized.
      properties:
        log:
          type: string
          description: The log trail as plain text (one timestamped line per event).
      required: [log]

    # ── Cloud ──────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    # ── Direct persistent connections ────────────────────────────────

    ConnectRequest:
      type: object
      description: >-
        Request body for POST /v1/comfy/connect. Omitting the body (or
        sending {}) lets the server pick from its configured ComfyUI server
        list in round-robin order.
      properties:
        server:
          type: string
          description: >-
            Optional name of a specific entry in the server's configured
            ComfyUI server list. When provided, only that server is tried.
          example: devonshire2

    ConnectResponse:
      type: object
      description: Identifiers for the newly established managed connection.
      required: [connect_id, client_id, server, pod_url]
      properties:
        connect_id:
          type: string
          format: uuid
          description: >-
            Identifier (uuid) used by the prompt and log endpoints.
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        client_id:
          type: string
          pattern: '^[0-9a-fA-F]{32}$'
          description: >-
            The client id used by the persistent websocket. Omit client_id
            when submitting a prompt to reuse it.
          example: abc123def4567890fedcba0987654321
        server:
          type: string
          description: Name of the server-list entry this connection uses.
          example: devonshire2
        pod_url:
          type: string
          format: uri
          description: Base URL of the ComfyUI server behind this connection.
          example: https://devonshire2-shine--comfy-playground-snapshot-comfy.modal.run

    ConnectPromptRequest:
      type: object
      description: >-
        Native ComfyUI prompt request. The server adds the connection's
        websocket client_id when it is omitted.
      required:
        - prompt
      properties:
        prompt:
          type: object
          additionalProperties: true
          description: ComfyUI API prompt graph keyed by node id.
        client_id:
          type: string
          pattern: '^[0-9a-fA-F]{32}$'
          description: >-
            Optional 32-character hexadecimal id. Supplying a new id opens a
            second persistent websocket subscription under the same connectId.
        extra_data:
          type: object
          additionalProperties: true
        front:
          type: boolean
        number:
          type: number

    ConnectPromptResponse:
      type: object
      description: >-
        Native ComfyUI POST /prompt response with connection and client ids
        appended for locating the prompt's websocket event log.
      additionalProperties: true
      required: [connect_id, client_id]
      properties:
        connect_id:
          type: string
          format: uuid
        client_id:
          type: string
          pattern: '^[0-9a-fA-F]{32}$'
        prompt_id:
          type: string
          description: >-
            ComfyUI's prompt identifier — addresses this prompt's recorded
            event list at GET /v1/comfy/connect/{connect_id}/{prompt_id}.
        number:
          type: number
        node_errors:
          type: object
          additionalProperties: true

    ConnectPromptLog:
      type: object
      description: >-
        One persisted JSON document per ComfyUI prompt id. The server
        appends one event object for every websocket message recorded for
        the prompt (plus the unmarked status/broadcast/binary frames
        attributed to it while it was in flight).
      required: [connectId, promptId, podUrl, createdAt, updatedAt, events]
      properties:
        connectId:
          type: string
          format: uuid
        promptId:
          type: string
        podUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: '#/components/schemas/ConnectLogEvent'

    ConnectLogEvent:
      type: object
      required: [receivedAt, message]
      properties:
        receivedAt:
          type: string
          format: date-time
        message:
          description: Raw parsed JSON websocket message, or a raw-message envelope.

    CloudPodRequest:
      type: object
      description: >-
        Request body for POST /v1/comfy/cloud.
        - Empty `{}` or `{"name": "..."}` → spawns a new pod.
        - `{"pod_url": "<url>"}` → checks status of an existing pod.
      properties:
        name:
          type: string
          description: Optional name for the spawned pod (create mode only).
        pod_url:
          type: string
          format: uri
          description: >-
            Tier 2 proxy URL of an existing pod. When provided, the endpoint
            returns the pod's health and models listing instead of creating
            a new pod.
          example: https://test-pod-abc123.beam.cloud:8188

    CloudCreateResponse:
      type: object
      description: >-
        Response from spawning a new ComfyUI pod via the Beam spawner.
        The spawner URL returns a 302 redirect; pod_url is the Location
        URL. The server additionally probes the fresh pod's Tier 2 proxy
        right away and merges the result into this response — so health,
        models_dir, and models are present when the pod already answers,
        or error when the initial probe failed (the pod may still be
        booting; retry with a status check).
      properties:
        pod_url:
          type: string
          format: uri
          description: >-
            Public URL of the spawned pod's Tier 2 API proxy (obtained from
            the 302 redirect Location header). Use this URL for status
            checks and prompt submission.
          example: https://test-pod-abc123.beam.cloud:8188
        health:
          $ref: '#/components/schemas/ProxyHealthResponse'
        models_dir:
          type: string
          example: /ComfyUI/models
        models:
          $ref: '#/components/schemas/ModelsListing'
        error:
          type: string
          description: Present only when the immediate post-spawn probe failed.
      required: [pod_url]

    CloudPodStatusResponse:
      type: object
      description: >-
        Health and model listing for a running ComfyUI pod.
        Returned when POST /v1/comfy/cloud is called with a pod_url.
        Mirrors the Tier 2 proxy GET / response from the Beam ComfyUI service.
      properties:
        health:
          $ref: '#/components/schemas/ProxyHealthResponse'
        models_dir:
          type: string
          example: /ComfyUI/models
          description: Absolute path to the (symlinked) models directory.
        models:
          $ref: '#/components/schemas/ModelsListing'
      required: [health, models_dir, models]

    ProxyHealthResponse:
      type: object
      description: Result of probing the backgrounded ComfyUI's GET /system_stats.
      properties:
        healthy:
          type: boolean
          example: true
        system_stats:
          $ref: '#/components/schemas/ComfySystemStats'
          description: Present only when healthy is true.
        error:
          type: string
          description: Present only when healthy is false. Last error message.

    ComfySystemStats:
      type: object
      description: Subset of ComfyUI's GET /system_stats body (forwarded verbatim).
      properties:
        system:
          type: object
          properties:
            os:
              type: string
              example: linux
            ram_total:
              type: integer
              format: int64
              example: 25728937984
            ram_free:
              type: integer
              format: int64
              example: 20000000000
            comfyui_version:
              type: string
              example: "0.3.27"
            python_version:
              type: string
              example: "3.10.12"
            pytorch_version:
              type: string
              example: "2.5.1+cu130"
        devices:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "NVIDIA GeForce RTX 4090"
              type:
                type: string
                example: cuda
              index:
                type: integer
                example: 0
              vram_total:
                type: integer
                format: int64
                example: 25769803776
              vram_free:
                type: integer
                format: int64
                example: 25600000000
              torch_vram_total:
                type: integer
                format: int64
              torch_vram_free:
                type: integer
                format: int64

    ModelsListing:
      type: object
      description: >-
        Recursive listing of /ComfyUI/models (the symlinked HuggingFace
        models volume). Each KEY is a top-level model subfolder name
        (e.g. checkpoints, loras, vae, clip, controlnet).
        Each VALUE is the sorted list of file names found anywhere under that
        subfolder (relative to the subfolder root). May be empty if no models
        have been uploaded.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        checkpoints:
          - sd_xl_base_1.0.safetensors
          - sd_xl_refiner_1.0.safetensors
        loras:
          - wan/lightning_4steps.safetensors
        vae:
          - sdxl_vae.safetensors

    # ── Cloud Prompt ──────────────────────────────────────────────

    CloudPromptRequest:
      type: object
      description: >-
        Request body for POST /v1/comfy/cloud/prompt.
        Sends a ComfyUI workflow graph to a spawned pod's Tier 2 proxy.
        Mirrors the beam_comfy_service PromptRequest schema.
      properties:
        pod_url:
          type: string
          format: uri
          description: >-
            Tier 2 proxy URL of the spawned pod (obtained from the
            create endpoint's pod_url field).
          example: "https://test-pod-abc123.beam.cloud:8188"
        prompt:
          type: object
          additionalProperties: true
          description: >-
            The workflow document to execute — the ORIGINAL workflow json
            (v0.4/v1 editor format, what generations store). The server
            converts it to the flat API prompt ({"<nodeId>": {"class_type",
            "inputs"}}) before forwarding to the pod; documents already in
            API prompt format are passed through unchanged.
        client_id:
          type: string
          description: >-
            Optional 32-char hex identifier for the submission. In
            server-side processing mode the server generates one per
            submission when omitted (or invalid), forwards it to the pod,
            and uses it to scope the shared pod's broadcast stream: the
            job's prompt_id is learned from the proxy_enqueue event and
            stream events carrying a different prompt_id are dropped, so
            each generation json only receives its own job's events even
            when multiple generations are queued on the same pod.
          example: abc123def4567890fedcba0987654321
        extra_data:
          type: object
          additionalProperties: true
          description: Optional. Passed through to ComfyUI's extra_data field.
        front:
          type: boolean
          description: Optional. Forwarded to ComfyUI POST /prompt queue-front flag.
        number:
          type: number
          description: Optional. Forwarded to ComfyUI POST /prompt.
        workflow_id:
          type: string
          description: >-
            Optional. When provided together with generation_id, enables
            server-side processing: the server consumes the pod's NDJSON
            stream in the background and keeps the generation json updated
            (same file written by /v1/comfy/workflows/{id}/generate).
            The request returns 202 immediately — clients poll
            GET /v1/comfy/workflows/{id}/generate for progress instead of
            reading the stream.
          example: "a1b2c3d4"
        generation_id:
          type: string
          description: >-
            Generation entry id to update while processing (server-side
            processing mode only).
          example: "20260729-101530"
      required:
        - pod_url
        - prompt

    CloudStreamEvent:
      type: object
      description: >-
        One line in the application/x-ndjson stream returned by
        POST /v1/comfy/cloud/prompt. Every event is
        {"type": "<EventType>", "data": <event-specific>} on a single line,
        terminated by \n.
      properties:
        type:
          type: string
          description: >-
            Event type discriminator. Common values:
            proxy_enqueue, proxy_done, proxy_error, status,
            execution_start, execution_cached, progress, executing,
            executed, execution_error, execution_success,
            execution_interrupted, binary.
        data:
          type: object
          additionalProperties: true
          description: Event-specific payload. See beam_comfy_service.yaml for details.
      required:
        - type
        - data
