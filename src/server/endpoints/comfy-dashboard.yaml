openapi: 3.0.3
info:
  title: ComfyUI Dashboard API
  description: >-
    API for managing ComfyUI workflows and cloud pod management. Provides
    CRUD for workflows, generation snapshots, and direct-access Beam cloud
    pods.     Every spawned pod gets ONE persistent ComfyUI websocket held in
    server memory (opened during POST /v1/comfy/cloud, which blocks until
    the socket connects, and kept alive until the cloud server terminates
    it — on unreachability, or after its queue stays empty for the
    configurable idle timeout, default 30 s); GET /v1/comfy/cloud lists
    those active pods with their server-tracked queue lists (prompt ids,
    queued/running status, workflow/generation ids) — clients mirror that
    answer and keep no pod state of their own. Prompt processing happens server-side: POST
    /v1/comfy/cloud/prompt (with workflow_id + generation_id) submits over
    the pod's shared socket, demultiplexes events by prompt_id, records
    every routed event into the prompt's .log file (one log per prompt),
    and keeps the generation json updated — clients poll
    GET /v1/comfy/workflows/{id}/generate for progress instead of
    streaming. Result media (images/videos/audio) is persisted on disk as
    plain asset files and served per item from
    GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index},
    which 302-redirects to the static /v1/comfy/media mount (streamed off
    disk with byte-range support) — usable directly in <img>/<video>/<audio>
    tags, and the generation json only carries small file references.
    Multiple generations may be queued on the same pod
    concurrently; the shared websocket carries them all and prompt_id
    scoping keeps each job's events in its own generation json/log.
  version: 0.9.0
servers:
  - url: http://127.0.0.1:8188
    description: Local ComfyUI server
  - url: https://comfy-spawner.beam.cloud
    description: Beam ComfyUI spawner (Tier 1 — used by POST /v1/comfy/cloud)
tags:
  - name: Workflows
    description: CRUD for ComfyUI workflows
  - name: Cloud
    description: >-
      Beam cloud pod management — spawn pods (each gets one persistent
      server-held websocket), list active pods, and check pod status
paths:
  # ── Workflows ──────────────────────────────────────────────────────

  /v1/comfy/workflows:
    get:
      operationId: listWorkflows
      summary: List all workflows
      description: >-
        Returns stored workflow metadata, optionally filtered by search query
        (matches name, description, or tags). Each entry includes id, name,
        description, nodeCount, timestamps, tags, and inputFields (the
        workflow's declared Input markings). Sorted by modifiedDate
        descending (most recently modified first).
      tags:
        - Workflows
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Free-text search query. Matches against workflow name, description,
            and tags (case-insensitive substring match).
          schema:
            type: string
      responses:
        '200':
          description: List of all workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
              example:
                workflows:
                  - id: wf-001
                    name: Text-to-Image Basic
                    description: Simple txt2img workflow
                    nodeCount: 8
                    createdDate: '2026-07-01T10:00:00.000Z'
                    modifiedDate: '2026-07-01T10:00:00.000Z'
                    tags: [txt2img, basic]
                    inputFields: ['3:data_uri']
    post:
      operationId: createWorkflow
      summary: Create a new workflow
      description: >-
        Uploads a new ComfyUI workflow. Accepts the workflow name, optional
        description, and the raw ComfyUI workflow JSON. Extracts node
        information and stores the workflow.
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '200':
          description: Workflow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkflowResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Get a specific workflow
      description: >-
        Returns the full workflow including all nodes and the raw ComfyUI JSON.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateWorkflow
      summary: Update a workflow
      description: >-
        Partially updates an existing workflow. Accepts any combination of
        name, description, and raw workflow JSON. Only provided fields are
        updated; omitted fields retain their current values.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowRequest'
      responses:
        '200':
          description: Workflow updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow
      description: Permanently removes a workflow and all its data.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}/generate:
    get:
      operationId: listGenerations
      summary: List generations for a workflow
      description: >-
        Returns lightweight summaries of all generation snapshots for the
        given workflow, sorted by createdDate descending (newest first).
        Each summary omits the heavy prompt (full workflow JSON) and result
        payloads (image/video data: URLs, often megabytes of base64) so the
        list loads fast. Each summary includes a resultCount and
        resultItems (per-result metadata without payloads) so callers can
        render "N items" and stream previews straight from
        GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}
        without fetching the full entry.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of generation summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationListResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: generateWorkflow
      summary: Generate a workflow snapshot
      description: >-
        Creates a generation snapshot and stores it in a "generation"
        subfolder inside the workflow's directory as a JSON file with
        metadata (status, createdDate, etc.). The event progression of the
        subsequent run lives in the sibling .log file, not in the json.
        The snapshotted `prompt` is the optional request body's prompt
        when provided — the UI sends its serialized ORIGINAL workflow json
        (v0.4/v1 editor format, with every edit), so the generation
        captures exactly the document visible at click time, lossless.
        Without a body, the workflow's stored workflow.json is snapshotted
        instead. Submissions to a Comfy Cloud pod convert the stored
        document to the flat API prompt server-side at submission time.
        The generation's id (the file base name) comes from the optional
        request body `name`, sanitized to a safe file name; when omitted,
        a timestamped default (YYYYMMDD-HHMMSS) is used.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: object
                  additionalProperties: true
                  description: >-
                    Optional. The ORIGINAL workflow json to snapshot instead
                    of the stored workflow.json — the v0.4/v1 editor-format
                    document ({"version", "nodes", "links", ...}) built from
                    the caller's current edited state, kept lossless.
                    Consumers submitting to a Comfy Cloud pod convert it to
                    the flat API prompt server-side at submission time.
                name:
                  type: string
                  description: >-
                    Optional. Name for the new generation — used as its id
                    (the generation json/log file base name) after
                    sanitizing filename-unsafe characters. When omitted,
                    the timestamped default (YYYYMMDD-HHMMSS) is used.
                    The dashboard UI defaults to "<workflow name>_<local
                    timestamp>". Collisions get a -01, -02, ... suffix.
            examples:
              editor_snapshot:
                summary: Snapshot the caller's edited workflow json
                value:
                  name: SDXL Poster_20260731-143022
                  prompt:
                    version: 1
                    nodes:
                      - id: 4
                        type: CheckpointLoaderSimple
                        pos: [0, 0]
                        widgets_values: [sd_xl_base_1.0.safetensors]
                      - id: 3
                        type: KSampler
                        pos: [300, 0]
                        widgets_values: [123456789012345, randomize, 20, 8, euler, normal, 1]
                        inputs:
                          - name: model
                            type: MODEL
                            link: 1
                    links:
                      - id: 1
                        origin_id: 4
                        origin_slot: 0
                        target_id: 3
                        target_slot: 0
                        type: MODEL
      responses:
        '200':
          description: Generation file created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}/generate/{generate_id}:
    get:
      operationId: getGeneration
      summary: Get a single generation (full data)
      description: >-
        Returns the complete generation entry for the given workflow and
        generate_id, including the snapshotted prompt and the result
        references (`file:` asset urls — legacy inline-base64 entries are
        migrated to files on read, never handed out as payloads). The list
        endpoint
        (GET /v1/comfy/workflows/{id}/generate) returns only lightweight
        summaries (no prompt, no result references) for fast loading, so the
        full entry must be fetched on demand per generation — typically only
        when the snapshotted prompt is needed, since result media serves
        via
        GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: generate_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The full generation entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateWorkflowResponse'
        '404':
          description: Generation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateGeneration
      summary: Update a generation entry
      description: >-
        Partially updates a generation snapshot. Used by the agent to report
        results (images, videos), mark completion status, and record timing.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: generate_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGenerationRequest'
      responses:
        '200':
          description: Generation updated successfully
          content:
            application/json:
                schema:
                  $ref: '#/components/schemas/GenerateWorkflowResponse'
        '404':
          description: Generation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteGeneration
      summary: Delete a generation snapshot
      description: >-
        Permanently removes a generation snapshot: the json record, its
        sibling .log event trail, and its media assets folder
        (`generation/{generate_id}/`). Note that deleting a still-pending or
        processing generation does NOT cancel its execution on the pod —
        the server's background stream consumer simply stops updating the
        (now missing) file.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: generate_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Generation deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGenerationResponse'
        '404':
          description: Generation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}:
    get:
      operationId: getGenerationResult
      summary: Serve a single generation result (image/video/audio)
      description: >-
        Serves one result item of a generation with its real Content-Type, so
        the URL can be used directly as
        `<img src="...">`, `<video src="...">`, or `<audio src="...">` —
        clients never need to pull the full generation entry just to preview
        an output.

        Behavior depends on how the result was persisted
        (see GenerationResultItem.url):
        - **`file:` reference** (current storage — the payload lives as a
          plain file in the generation's assets folder,
          `generation/{generate_id}/{index}.{ext}`) — answered with a `302`
          redirect (root-relative Location) to the static `/v1/comfy/media`
          mount, which streams the file off disk: `Accept-Ranges: bytes`
          advertised and `Range: bytes=start-end` honored (206 Partial
          Content), which some browsers (e.g. Safari) require before they
          will play `<video>` at all, and which enables seeking on large
          payloads. The endpoint itself never reads the bytes. The
          root-relative redirect resolves against whatever origin the client
          reached the server by (localhost, LAN IP, hostname), so the same
          generation json serves every interface.
        - **`data:` URL** (base64 payload, from generations written before
          file-backed storage) — MIGRATED on first read: decoded once,
          written to an asset file, and the generation json rewritten with
          a `file:` reference; the request is then answered with the same
          media-mount redirect. A decode-and-stream path (with the range
          behavior above) remains only as the fallback for the case where
          the asset write fails — nothing keeps serving base64 long-term.
        - **Remote http(s) URL** — answered with a `302` redirect so the
          upstream server delivers the bytes directly.

        The lightweight `resultItems` array on GenerationSummary entries
        (GET /v1/comfy/workflows/{id}/generate) carries the per-result
        metadata (type, mimeType, size, nodeId) — everything this endpoint
        needs except the payload itself — so a UI can build these URLs as
        `/result/0`, `/result/1`, ... straight from the summary list without
        any extra fetch.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: generate_id
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          description: Zero-based position of the result within the generation's `result` array.
          schema:
            type: integer
            minimum: 0
        - name: Range
          in: header
          required: false
          description: >-
            Optional byte range (e.g. `bytes=0-1023`) — served as 206 Partial
            Content for data:-backed results; for file-backed results the
            browser re-sends it to the /v1/comfy/media mount after the
            redirect, which honors it there.
          schema:
            type: string
      responses:
        '200':
          description: The result payload (full body).
          headers:
            Content-Type:
              description: The stored mimeType of the result (e.g. image/png, video/mp4).
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Cache-Control:
              schema:
                type: string
                example: private, max-age=3600
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content for a successful Range request.
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes 0-1023/2048576
            Content-Length:
              schema:
                type: integer
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
        '302':
          description: >-
            The result is file-backed (root-relative redirect to the static
            /v1/comfy/media mount, which streams the file off disk) or a
            remote URL (redirect to it, so the upstream server delivers the
            bytes). Followed transparently inside <img>/<video>/<audio>.
        '400':
          description: Missing/invalid path parameter (index not a non-negative integer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Generation not found, or index out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: Range cannot be satisfied
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes */2048576
        '422':
          description: Result payload is not servable (unsupported url format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}/generate/{generate_id}/log:
    get:
      operationId: getGenerationLog
      summary: Get a generation's .log event trail
      description: >-
        Returns the timestamped .log file written next to the generation
        json by POST /v1/comfy/cloud/prompt while it consumes the run's
        events off the pod's shared persistent websocket (matched by
        prompt_id — one log per prompt) — the chronological trail of status
        changes and per-event summaries (submission, enqueue, progress,
        captured results, terminal error). Intended for DEBUGGING failed
        runs: the dashboard's OUTPUT tab opens this from failed/error
        generations (a failed run, or a "completed" run that produced no
        output) in a read-only dialog with a Copy button.

        Generations without a .log file (written outside the cloud prompt
        endpoint, or predating the .log trail) get a trail SYNTHESIZED from
        the generation json itself (creation, final status, timing, error
        message), so the response always carries something meaningful.
        Logs larger than 256 KB are tail-truncated with a notice prepended
        — the recent lines are the ones carrying the terminal error.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: generate_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The generation's log trail (plain text in a json envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationLogResponse'
        '400':
          description: Missing path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Generation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Cloud ──────────────────────────────────────────────────────────

  /v1/comfy/cloud:
    get:
      operationId: listCloudPods
      summary: List available GPUs and active cloud pods with their queues
      description: >-
        Returns the available GPU keys from the server's
        comfyCloudServiceEndpoint registry and every cloud pod whose
        server-managed websocket is currently held in memory, each with the
        server-tracked queue list. The GPU array is the UI's source for the
        New-pod picker, so clients do not duplicate secret configuration.
        Pods enter the list when spawned via POST /v1/comfy/cloud (or adopted
        by a status check) and drop out as soon as the cloud server terminates
        their socket — either because the pod became unreachable (websocket
        close/error, failed protocol ping) or because its queue stayed empty
        for the configured idle timeout (default 30 s,
        COMFY_DASHBOARD_POD_IDLE_TIMEOUT_MS). There is exactly one websocket
        per pod — it carries every prompt that pod processes.

        The server is the ONLY keeper of instance state: each entry reports
        whether the pod's websocket is connected (`active`), how many
        prompts the pod is currently processing (`prompts`), and the
        insertion-ordered `queue` (prompt_id, queued/running status,
        workflow/generation ids, timestamps). Clients only mirror these
        answers — they track no pod or queue state themselves and never
        probe pods individually.
      tags:
        - Cloud
      responses:
        '200':
          description: The active pods (empty list when none are connected)
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/CloudPodListResponse'
              example:
                available_gpus: ["4090", "6000"]
                pods:
                  - pod_url: "https://test-pod-abc123.beam.cloud:8188/"
                    gpu: "4090"
                    name: "my-comfy-pod"
                    client_id: "abc123def4567890fedcba0987654321"
                    active: true
                    prompts: 2
                    queue:
                      - prompt_id: "f0c1a2b3-1234-5678-9abc-def012345678"
                        number: 1
                        status: running
                        workflow_id: "20260729-101530"
                        generation_id: "20260729-101545"
                        queuedAt: "2026-08-05T10:15:31.000Z"
                        startedAt: "2026-08-05T10:15:33.000Z"
                      - prompt_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                        number: 2
                        status: queued
                        workflow_id: "20260729-101530"
                        generation_id: "20260729-101620"
                        queuedAt: "2026-08-05T10:16:21.000Z"
                        startedAt: null
                    connectedAt: "2026-08-05T10:15:30.000Z"
                  - pod_url: "https://b300-pod-def456.beam.cloud:8188/"
                     gpu: "6000"
                    client_id: "000aaaaabbbbccccddddeeeeffff0123"
                    active: true
                    prompts: 0
                    queue: []
                    connectedAt: "2026-08-05T10:20:41.000Z"
    post:
      operationId: cloudPod
      summary: Create a cloud pod (blocks until its websocket connects) or check pod status
      description: >-
        Dual-purpose endpoint for Beam cloud pod management:

        **Create a pod** — Send `{"gpu": "4090"}` (required) plus an
        optional `{"name": "my-pod"}`. The GPU key selects the spawner
        server list registered under `comfyCloudServiceEndpoint`
        (gpu → {serverName: spawnerUrl}); the servers are tried IN ORDER:
        a GET to the spawner URL returns a 302 redirect to the spawned
        pod's public ComfyUI URL. A failed attempt (unreachable server,
        non-redirect status, redirect without Location) falls through to
        the next server; when every server for the GPU has failed, the
        endpoint answers 503 — no server is available to spawn the
        requested GPU.

        Once the spawner answers, the server opens the pod's native
        ComfyUI websocket — the SINGLE persistent socket that will carry
        every prompt this pod ever processes — and **only answers once the
        websocket is connected and held in server memory**. The connection
        is maintained forever (protocol pings) until the cloud server
        terminates it. A fresh pod that refuses the websocket is NOT handed
        out: the endpoint answers 502 and nothing is registered.

        **Check pod status** — Send `{"pod_url": "<pod_url>"}`. Registry-
        backed: the pod's server-managed websocket is reused, or — when the
        server does not track the pod yet (e.g. after a restart) — opened
        and registered (adopted), so the answer always reflects the single
        shared socket. Returns the pod's health, system stats, and empty
        model-list fields. A pod refusing the websocket answers 502.
      tags:
        - Cloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPodRequest'
            examples:
              create_pod:
                summary: Spawn a new pod on a 4090 GPU
                value:
                  gpu: "4090"
              create_named_pod:
                 summary: Spawn a 6000 pod with a custom name
                value:
                   gpu: "6000"
                  name: my-comfy-pod
              check_status:
                summary: Check the status of an existing pod
                value:
                  pod_url: "https://test-pod-abc123.beam.cloud:8188"
      responses:
        '200':
          description: >-
            Pod websocket connected and held in server memory (create), or
            pod status returned over its server-managed socket (status).
            The response shape depends on the request:
              - **Create**: `{ pod_url, gpu, spawner, health, models_dir, models }`
            - **Status**: `{ health, models_dir, models }`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CloudCreateResponse'
                  - $ref: '#/components/schemas/CloudPodStatusResponse'
              examples:
                create_result:
                  summary: Pod created successfully (persistent websocket held)
                  value:
                    pod_url: "https://test-pod-abc123.beam.cloud:8188"
                status_result:
                  summary: Pod status returned (native ComfyUI pod)
                  value:
                    health:
                      healthy: true
                      system_stats:
                        system:
                          os: linux
                          ram_total: 25728937984
                          ram_free: 20000000000
                          comfyui_version: "0.3.27"
                          python_version: "3.10.12"
                          pytorch_version: "2.5.1+cu130"
                        devices:
                          - name: "NVIDIA GeForce RTX 4090"
                            type: cuda
                            index: 0
                            vram_total: 25769803776
                            vram_free: 25600000000
                    models_dir: /ComfyUI/models
                    models:
                      checkpoints:
                        - sd_xl_base_1.0.safetensors
                      loras:
                        - wan/lightning_4steps.safetensors
                      vae:
                        - sdxl_vae.safetensors
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >-
            Spawner unavailable, or the pod refused its persistent ComfyUI
            websocket — a pod that cannot hold the socket is never handed
            out and never registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            No server available to spawn the requested GPU — every spawner
            in the GPU's server list was tried and failed. The `attempts`
            array reports each server's failure in order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "No server available to spawn gpu=4090 — every spawner failed"
                attempts:
                  - server: lancer
                    error: "fetch failed"
                  - server: backup
                    error: "Spawner returned HTTP 500 (expected 302 redirect)"

  /v1/comfy/cloud/prompt:
    post:
      operationId: cloudPrompt
      summary: Submit a prompt to a spawned pod — server-side processing (202) or direct event stream (200)
      description: >-
        Two modes:

        **Server-side processing** — include `workflow_id` and
        `generation_id` in the body. The server submits the prompt to the
        pod over HTTP POST /prompt (bound to the shared socket's client_id),
        registers a prompt_id subscriber on the pod's persistent websocket,
        and keeps the generation json updated by itself (status →
        processing/completed/failed, results, timing — the same file
        written by /v1/comfy/workflows/{id}/generate). Every event routed
        to the prompt_id is traced into the sibling .log file — one log per
        prompt — intentionally NOT stored in the generation json. Returns 202
        immediately; clients poll GET /v1/comfy/workflows/{id}/generate
        for progress.

        **Direct stream mode** — no workflow reference. Streams the pod's
        shared-socket events for this prompt_id (plus unattributed
        broadcasts) back as `application/x-ndjson` — one JSON object per
        line. **Clients must read the response body as a stream**, parsing
        one JSON document per line, until they receive:
        - `{"type":"prompt_done","data":{}}` — run completed normally, or
        - `{"type":"execution_error",...}` / `{"type":"prompt_error",...}` — failure
          (prompt_error also covers the pod socket dying mid-run).

        The pod must be registered and websocket-connected on this server:
        pods are spawned (or adopted) via POST /v1/comfy/cloud, which holds
        ONE persistent websocket per pod in memory until the cloud server
        closes it. This endpoint NEVER opens another websocket — unknown or
        terminated pods are rejected with 502. ComfyUI routes each prompt's
        execution events to the socket whose client_id submitted it, so all
        submissions share the pod-level client_id and the server
        demultiplexes the single stream by prompt_id. Native websocket
        frames pass through; binary previews are translated to
        imagepreview.update (attributed to the last executing node/prompt)
        and the direct envelope events are prompt_queued, prompt_done, and
        prompt_error.
      tags:
        - Cloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPromptRequest'
            examples:
              basic_prompt:
                summary: Direct ComfyUI mode — client reads the NDJSON stream
                value:
                  pod_url: "https://test-pod-abc123.beam.cloud:8188"
                  prompt:
                    "3":
                      class_type: KSampler
                      inputs:
                        seed: 123456789012345
                        steps: 20
                        cfg: 8
                        sampler_name: euler
                        scheduler: normal
                        denoise: 1
                        model: ["4", 0]
                        positive: ["6", 0]
                        negative: ["7", 0]
                        latent_image: ["5", 0]
                    "4":
                      class_type: CheckpointLoaderSimple
                      inputs:
                        ckpt_name: sd_xl_base_1.0.safetensors
                  client_id: "abc123def4567890fedcba0987654321"
              server_side_processing:
                summary: Server-side mode — server consumes the stream, poll the generation for progress
                value:
                  pod_url: "https://test-pod-abc123.beam.cloud:8188"
                  prompt:
                    "3":
                      class_type: KSampler
                      inputs:
                        seed: 123456789012345
                        steps: 20
                        cfg: 8
                        sampler_name: euler
                        scheduler: normal
                        denoise: 1
                        model: ["4", 0]
                        positive: ["6", 0]
                        negative: ["7", 0]
                        latent_image: ["5", 0]
                    "4":
                      class_type: CheckpointLoaderSimple
                      inputs:
                        ckpt_name: sd_xl_base_1.0.safetensors
                  workflow_id: "20260729-101530"
                  generation_id: "20260729-101545"
                  extra_data:
                    workflow_id: "20260729-101530"
                    generation_id: "20260729-101545"
      responses:
        '202':
          description: >-
            Accepted for server-side processing (workflow_id and
            generation_id were provided). The server consumes the prompt's
            events off the pod's shared persistent websocket (matched by
            prompt_id) and updates the generation json file itself (the raw
            events are traced into the sibling .log file — one log per
            prompt — not into the json). There is no response stream —
            poll GET /v1/comfy/workflows/{id}/generate for progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    example: true
                  workflow_id:
                    type: string
                  generation_id:
                    type: string
                  client_id:
                    type: string
                    description: >-
                      The 32-char hex client_id of the pod's SHARED
                      persistent websocket — every prompt on this pod is
                      submitted under it, and the server demultiplexes the
                      socket's events by prompt_id.
                    example: abc123def4567890fedcba0987654321
                  prompt_id:
                    type: string
                    nullable: true
                    description: >-
                      The ComfyUI prompt_id assigned by the pod (from the
                      POST /prompt acknowledgement) — the routing key for
                      this run's events and its .log trail on the shared
                      socket.
                    example: f0c1a2b3-1234-5678-9abc-def012345678
                required: [accepted, workflow_id, generation_id, client_id]
        '200':
          description: >-
            Chunked NDJSON stream of progress events from the pod's shared
            persistent websocket (direct stream mode — no workflow reference
            provided), demultiplexed to this prompt_id plus unattributed
            broadcasts. Native ComfyUI events and the prompt_queued,
            prompt_done, and prompt_error envelope events are emitted one
            per line.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/CloudStreamEvent'
              examples:
                happy_path:
                  summary: A successful txt2img run
                  value: |
                    {"type":"prompt_queued","data":{"prompt_id":"f0c...","number":1,"node_errors":{}}}
                    {"type":"status","data":{"status":{"queue_running":[],"queue_pending":[]},"sid":"abc..."}}
                    {"type":"execution_start","data":{"prompt_id":"f0c..."}}
                    {"type":"progress","data":{"value":1,"max":20,"prompt_id":"f0c...","node":"3"}}
                    {"type":"progress","data":{"value":20,"max":20,"prompt_id":"f0c...","node":"3"}}
                    {"type":"executing","data":{"node":"8","prompt_id":"f0c..."}}
                    {"type":"executed","data":{"node":"9","output":{"images":[{"filename":"ComfyUI_00001_.png","subfolder":"","type":"output"}]},"prompt_id":"f0c..."}}
                    {"type":"executing","data":{"node":null,"prompt_id":"f0c..."}}
                    {"type":"execution_success","data":{"prompt_id":"f0c..."}}
                    {"type":"prompt_done","data":{}}
        '400':
          description: Invalid request (missing prompt, invalid pod_url)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            Server misconfigured (server-side processing requested without
            a project root for the generation file store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >-
            Pod not connected (unknown pod_url or its persistent websocket
            was terminated — spawn/adopt it via POST /v1/comfy/cloud first),
            or the HTTP prompt submission to the pod failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# =============================================================================
#  COMPONENTS
# =============================================================================
components:
  schemas:

    # ── Workflows ──────────────────────────────────────────────────

    WorkflowMeta:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        nodeCount:
          type: integer
        createdDate:
          type: string
        modifiedDate:
          type: string
        tags:
          type: array
          items:
            type: string
        inputFields:
          type: array
          items:
            type: string
          description: >-
            Widget keys ("<nodeId>:<inputName>") marked as workflow Inputs
            in the dashboard's PROMPT tab (mirrored from the workflow
            json's extra.inputFields). Workflows with a non-empty list
            appear in the result preview's workflow dropdown — picking one
            feeds the viewed image's base64 data stream into the marked
            Data URI (Universal Data Input) fields and triggers a run.

    Workflow:
      allOf:
        - $ref: '#/components/schemas/WorkflowMeta'
        - type: object
          properties:
            nodes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  position:
                    type: object
                    properties:
                      x:
                        type: number
                      y:
                        type: number
                  inputs:
                    type: object
            raw:
              type: object
              description: The raw ComfyUI workflow JSON

    CreateWorkflowRequest:
      type: object
      required:
        - name
        - raw
      properties:
        name:
          type: string
        description:
          type: string
        raw:
          type: object
          description: The raw ComfyUI workflow JSON

    CreateWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowMeta'

    GetWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'

    DeleteWorkflowResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: string

    DeleteGenerationResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: string
          description: Id of the deleted generation.

    UpdateWorkflowRequest:
      type: object
      description: >-
        Partial update for an existing workflow. Only include fields that
        should change; omitted fields retain their current values.
      properties:
        name:
          type: string
          description: New name for the workflow.
        description:
          type: string
          description: New description for the workflow.
        raw:
          type: object
          description: >-
            Updated raw ComfyUI workflow JSON. When provided, the node list
            and nodeCount are re-extracted from this object.
        tags:
          type: array
          items:
            type: string
          description: Replacement tag list.

    UpdateWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'

    WorkflowListResponse:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMeta'

    GenerateWorkflowResponse:
      type: object
      description: Response from creating a generation snapshot.
      properties:
        generation:
          $ref: '#/components/schemas/GenerationEntry'
      required: [generation]

    GenerationListResponse:
      type: object
      description: >-
        Lightweight summaries of generation snapshots for a workflow. The
        list endpoint returns summaries (no prompt, no result payloads) so
        it loads fast; fetch the full entry via
        GET /v1/comfy/workflows/{id}/generate/{generate_id} when needed.
      properties:
        generations:
          type: array
          items:
            $ref: '#/components/schemas/GenerationSummary'

    GenerationSummary:
      type: object
      description: >-
        Lightweight summary of a generation entry — what the list endpoint
        (GET /v1/comfy/workflows/{id}/generate) returns. Excludes the heavy
        prompt (full workflow JSON) and result payloads (image/video data:
        URLs, often megabytes of base64) so the list stays small. The
        resultItems metadata lets clients preview outputs via
        GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}
        (streamable binary — usable directly in <img>/<video>) without
        fetching the full entry; the full prompt remains available via
        GET /v1/comfy/workflows/{id}/generate/{generate_id}.
      properties:
        id:
          type: string
          description: Generation identifier (timestamp-based filename without .json)
          example: "20260728-153045"
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Current status of the generation
        createdDate:
          type: string
          format: date-time
          description: ISO timestamp when the generation was created
        completedDate:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp when the generation completed (null if pending)
        generatedTime:
          type: string
          nullable: true
          description: Human-readable generation duration (e.g. "12.5s")
        error:
          type: string
          nullable: true
          description: Error message if the generation failed
        resultCount:
          type: integer
          description: >-
            Number of result items (images/videos) in the full entry. Lets
            callers render "N items" without the result payloads themselves.
        resultItems:
          type: array
          description: >-
            Lightweight per-result metadata — everything except the heavy
            `url` payload (type, mimeType, size, nodeId). Lets a UI pick
            <img> vs <video> and build streaming URLs directly:
            GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}.
          items:
            $ref: '#/components/schemas/GenerationResultMeta'
      required:
        - id
        - status
        - createdDate
        - completedDate
        - generatedTime
        - error
        - resultCount
        - resultItems

    UpdateGenerationRequest:
      type: object
      description: >-
        Partial update for a generation entry. Only include fields that
        should change; omitted fields retain their current values.
      properties:
        status:
          type: string
          enum: [pending, processing, completed, failed]
        result:
          type: array
          items:
            $ref: '#/components/schemas/GenerationResultItem'
        generatedTime:
          type: string
          nullable: true
          description: Human-readable generation duration (e.g. "12.5s")
        completedDate:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true

    GenerationEntry:
      type: object
      description: >-
        A generation snapshot. Contains the workflow prompt and metadata
        tracking its status. Returned in full by POST /v1/comfy/workflows/{id}/generate
        (on creation), GET /v1/comfy/workflows/{id}/generate/{generate_id}
        (single-entry fetch), and PUT .../generate/{generate_id} (update).
        The list endpoint (GET /v1/comfy/workflows/{id}/generate) returns
        lightweight GenerationSummary entries instead.
      properties:
        id:
          type: string
          description: Generation identifier (timestamp-based filename without .json)
          example: "20260728-153045"
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Current status of the generation
        createdDate:
          type: string
          format: date-time
          description: ISO timestamp when the generation was created
        completedDate:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp when the generation completed (null if pending)
        generatedTime:
          type: string
          nullable: true
          description: Human-readable generation duration (e.g. "12.5s")
        error:
          type: string
          nullable: true
          description: Error message if the generation failed
        prompt:
          type: object
          description: >-
            The ORIGINAL workflow json snapshot (v0.4/v1 editor format — the
            lossless document: positions, links, widget values, groups).
            Converted to the flat API prompt server-side when submitted to
            a Comfy Cloud pod, and the verbatim copy source for
            "create a workflow from this generation".
        result:
          type: array
          description: Array of generated outputs (images, videos, etc.)
          items:
            $ref: '#/components/schemas/GenerationResultItem'
          # The raw NDJSON event progression of a run is intentionally NOT
          # stored in the generation json — the server writes a timestamped
          # .log file next to the json with a line per status change and per
          # streamed event, which is sufficient to understand the run.
          # All fields are always present in responses — the server
          # normalizes older files on read (nullable fields read as null,
          # arrays as []).
      required:
        - id
        - status
        - createdDate
        - completedDate
        - generatedTime
        - error
        - prompt
        - result

    GenerationResultItem:
      type: object
      description: A single result from a generation (image, video, or audio).
      properties:
        type:
          type: string
          enum: [image, video, audio]
        url:
          type: string
          description: >-
            Persisted location of the result. Shapes:
            - `file:<index>.<ext>` (the only shape stored going forward) —
              the payload is a plain file in the generation's assets folder
              (`generation/{generate_id}/`); the json carries only this
              small reference. Serve it via
              GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index},
              which 302-redirects to the static /v1/comfy/media mount.
              Host-relative by design: no server address is baked in, so the
              same json works on localhost and over the LAN alike.
            - `data:` URL (base64, legacy generations — migrated to `file:`
              on first read: the bytes are moved to an asset file and the
              json rewritten).
            - Remote http(s) URL.
            Blob URLs are intentionally never stored: they die with the page
            session. Viewers never convert payloads into throwaway blob
            URLs — they consume the result endpoint directly as
            <img src> / <video src> / <audio src>.
        mimeType:
          type: string
          example: "image/png"
        size:
          type: integer
          description: Size in bytes
        nodeId:
          type: string
          description: The workflow node that produced this result
      required: [type, url, mimeType, size, nodeId]

    GenerationResultMeta:
      type: object
      description: >-
        A GenerationResultItem WITHOUT its `url` field — the display
        metadata carried by GenerationSummary entries so clients can label
        results and build serving URLs without pulling the payload.
        The media is served by
        GET /v1/comfy/workflows/{id}/generate/{generate_id}/result/{index}.
      properties:
        type:
          type: string
          enum: [image, video, audio]
        mimeType:
          type: string
          example: "image/png"
        size:
          type: integer
          description: Size in bytes
        nodeId:
          type: string
          description: The workflow node that produced this result
      required: [type, mimeType, size, nodeId]

    GenerationLogResponse:
      type: object
      description: >-
        A generation's .log event trail — the timestamped text the cloud
        prompt endpoint writes next to the generation json while processing
        the run. Synthesized from the generation json when no .log file
        exists; tail-truncated at 256 KB (with a notice) when oversized.
      properties:
        log:
          type: string
          description: The log trail as plain text (one timestamped line per event).
      required: [log]

    # ── Cloud ──────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    CloudPodRequest:
      type: object
      description: >-
        Request body for POST /v1/comfy/cloud.
        - `{"gpu": "4090"}` or `{"gpu": "...", "name": "..."}` → spawns a
          new pod on that GPU (the GPU's spawner servers are tried in
          order; 503 when none can spawn it).
        - `{"pod_url": "<url>"}` → checks status of an existing pod.
      properties:
        gpu:
          type: string
          description: >-
             GPU to spawn the pod on (create mode, required). Must be a key
             of the server's comfyCloudServiceEndpoint registry — currently
             "4090" and "6000". Unknown keys are rejected with 400 and the
            list of available GPUs.
          example: "4090"
        name:
          type: string
          description: Optional name for the spawned pod (create mode only).
        pod_url:
          type: string
          format: uri
          description: >-
            Native ComfyUI URL of an existing pod. When provided, the
            endpoint reuses (or opens and registers) the pod's single
            persistent websocket and returns the pod's health and empty
            model-list fields instead of creating a new pod.
          example: https://test-pod-abc123.beam.cloud:8188

    CloudCreateResponse:
      type: object
      description: >-
        Response from spawning a new ComfyUI pod via the Beam spawner.
        The spawner URL returns a 302 redirect; pod_url is the Location
        URL. This response is only sent AFTER the pod's persistent
        websocket connected and is held in server memory — a fresh pod that
        refuses the socket answers 502 instead. With the socket held, the
        server merges the status probe into this response — so health,
        models_dir, and models are present, or error when the post-connect
        system_stats enrichment itself failed.
      properties:
        pod_url:
          type: string
          format: uri
          description: >-
            Public native ComfyUI URL of the spawned pod (obtained from the
            302 redirect Location header). Its websocket is already
            connected and registered — use this URL for prompt submission
            and pod-list matching.
          example: https://test-pod-abc123.beam.cloud:8188
        gpu:
          type: string
          description: Echo of the requested GPU the pod was spawned on.
          example: "4090"
        spawner:
          type: string
          description: >-
            Name of the spawner server (within the GPU's server list) that
            won the fallback chain and produced this pod.
          example: lancer
        health:
          $ref: '#/components/schemas/ComfyHealthResponse'
        models_dir:
          type: string
          example: /ComfyUI/models
        models:
          $ref: '#/components/schemas/ModelsListing'
        error:
          type: string
          description: Present only when the post-connect stats enrichment failed.
      required: [pod_url]

    CloudPodStatusResponse:
      type: object
      description: >-
        Health and model listing for a running ComfyUI pod.
        Returned when POST /v1/comfy/cloud is called with a pod_url.
         The health is based on the pod's server-managed persistent
         websocket (reused or adopted by this call), records the optional
         root HTTP check, and is enriched with native GET /system_stats when
         it answers. The model listing is empty because prompt execution
         uses the websocket protocol.
      properties:
        health:
          $ref: '#/components/schemas/ComfyHealthResponse'
        models_dir:
          type: string
          example: /ComfyUI/models
          description: >-
            Absolute path to the (symlinked) models directory. Empty for
            direct ComfyUI pods — the native server lists no models.
        models:
          $ref: '#/components/schemas/ModelsListing'
      required: [health, models_dir, models]

    CloudPodListEntry:
      type: object
      description: >-
        One cloud pod tracked by the server. There is exactly one persistent
        websocket per cloud pod, opened when the pod was created via
        POST /v1/comfy/cloud and held in memory until the cloud server
        terminates it (at which point the pod drops out of this list).
        Termination happens when the pod becomes unreachable (websocket
        close/error, failed protocol ping) OR when the pod has been idle —
        no queued prompts — for the configured idle timeout (default 30 s,
        COMFY_DASHBOARD_POD_IDLE_TIMEOUT_MS).
      properties:
        pod_url:
          type: string
          format: uri
          description: >-
            Normalized native ComfyUI URL of the pod (the registry key —
            URL.toString() form, so a bare host carries a trailing slash).
          example: "https://test-pod-abc123.beam.cloud:8188/"
        gpu:
          type: string
          description: GPU the pod was spawned on, when known (create echo).
          example: "4090"
        name:
          type: string
          description: Optional name given at spawn time.
          example: my-comfy-pod
        client_id:
          type: string
          description: >-
            The 32-char hex client_id of the pod's SHARED persistent
            websocket. Every prompt submitted to this pod is bound to it;
            the server demultiplexes the socket's events by prompt_id.
          example: abc123def4567890fedcba0987654321
        active:
          type: boolean
          description: >-
            The pod's server-managed websocket is currently connected
            (false is only observable in the instant between a remote close
            and the registry dropping the pod).
        prompts:
          type: integer
          description: >-
            Number of prompts currently being processed by this pod (its
            queue length plus prompt submissions still being registered).
          example: 2
        queue:
          type: array
          description: >-
            The pod's queued prompts — the server's authoritative,
            insertion-ordered queue record. Clients mirror this list; they
            never track queue state themselves. An entry is created when
            its prompt is registered on the pod, flips queued → running at
            execution_start, and drops out at the run's terminal event.
          items:
            $ref: '#/components/schemas/CloudPodQueueEntry'
        connectedAt:
          type: string
          format: date-time
          description: ISO timestamp when the persistent websocket connected.
      required: [pod_url, client_id, active, prompts, queue, connectedAt]

    CloudPodQueueEntry:
      type: object
      description: >-
        One prompt queued on a cloud pod — the server's authoritative queue
        record for that instance.
      properties:
        prompt_id:
          type: string
          description: ComfyUI prompt_id — the routing key on the pod's shared socket.
          example: f0c1a2b3-1234-5678-9abc-def012345678
        number:
          type: integer
          nullable: true
          description: ComfyUI queue position from the POST /prompt ack, when numeric.
          example: 3
        status:
          type: string
          enum: [queued, running]
          description: >-
            queued = accepted onto the pod, awaiting execution; running =
            the pod's socket delivered execution_start for this prompt.
        workflow_id:
          type: string
          description: >-
            Dashboard workflow id lifted from the submission's extra_data
            (server-side processing mode). Absent otherwise.
        generation_id:
          type: string
          description: >-
            Dashboard generation id lifted from the submission's extra_data
            (server-side processing mode). Absent otherwise.
        queuedAt:
          type: string
          format: date-time
          description: ISO timestamp when the server registered the prompt on this pod.
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp of the queued → running flip (execution_start).
      required: [prompt_id, number, status, queuedAt, startedAt]

    CloudPodListResponse:
      type: object
      description: >-
        The server's available GPU keys and active cloud pods — what GET
        /v1/comfy/cloud returns. Dashboards use available_gpus for the
        New-pod picker and poll pods to add/refresh their pod buttons
        automatically.
      properties:
        available_gpus:
          type: array
          description: >-
            Exact keys of runtime/secret/private/modal/comfy.ts exposed by
            the server. The values are accepted by POST /v1/comfy/cloud as
            the gpu field.
          items:
            type: string
        pods:
          type: array
          items:
            $ref: '#/components/schemas/CloudPodListEntry'
      required: [available_gpus, pods]

    ComfyHealthResponse:
      type: object
      description: >-
        Status of a pod whose persistent ComfyUI websocket is connected,
        enriched with GET /system_stats when it answers.
      properties:
        healthy:
          type: boolean
          example: true
        system_stats:
          $ref: '#/components/schemas/ComfySystemStats'
          description: Present only when healthy is true.
        error:
          type: string
          description: Present only when healthy is false. Last error message.

    ComfySystemStats:
      type: object
      description: Subset of ComfyUI's GET /system_stats body (forwarded verbatim).
      properties:
        system:
          type: object
          properties:
            os:
              type: string
              example: linux
            ram_total:
              type: integer
              format: int64
              example: 25728937984
            ram_free:
              type: integer
              format: int64
              example: 20000000000
            comfyui_version:
              type: string
              example: "0.3.27"
            python_version:
              type: string
              example: "3.10.12"
            pytorch_version:
              type: string
              example: "2.5.1+cu130"
        devices:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "NVIDIA GeForce RTX 4090"
              type:
                type: string
                example: cuda
              index:
                type: integer
                example: 0
              vram_total:
                type: integer
                format: int64
                example: 25769803776
              vram_free:
                type: integer
                format: int64
                example: 25600000000
              torch_vram_total:
                type: integer
                format: int64
              torch_vram_free:
                type: integer
                format: int64

    ModelsListing:
      type: object
      description: >-
        Recursive listing of /ComfyUI/models (the symlinked HuggingFace
        models volume). Each KEY is a top-level model subfolder name
        (e.g. checkpoints, loras, vae, clip, controlnet).
        Each VALUE is the sorted list of file names found anywhere under that
        subfolder (relative to the subfolder root). May be empty if no models
        have been uploaded.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        checkpoints:
          - sd_xl_base_1.0.safetensors
          - sd_xl_refiner_1.0.safetensors
        loras:
          - wan/lightning_4steps.safetensors
        vae:
          - sdxl_vae.safetensors

    # ── Cloud Prompt ──────────────────────────────────────────────

    CloudPromptRequest:
      type: object
      description: >-
        Request body for POST /v1/comfy/cloud/prompt.
        Sends a ComfyUI workflow graph to a spawned native ComfyUI pod.
        The pod must already hold its single server-managed websocket
        (spawned/adopted via POST /v1/comfy/cloud); this endpoint submits
        over HTTP POST /prompt bound to the shared socket's client_id and
        consumes the run's events from the shared socket, demultiplexed by
        prompt_id.
      properties:
        pod_url:
          type: string
          format: uri
          description: >-
            Native ComfyUI URL of the spawned pod (obtained from the create
            endpoint's pod_url field). Must be registered and
            websocket-connected on this server, otherwise 502.
          example: "https://test-pod-abc123.beam.cloud:8188"
        prompt:
          type: object
          additionalProperties: true
          description: >-
            The workflow document to execute — the ORIGINAL workflow json
            (v0.4/v1 editor format, what generations store). The server
            converts it to the flat API prompt ({"<nodeId>": {"class_type",
            "inputs"}}) before forwarding to the pod; documents already in
            API prompt format are passed through unchanged.
        client_id:
          type: string
          description: >-
            Optional compatibility field — ignored. Every prompt is
            submitted under the pod's SHARED websocket client_id, and the
            server demultiplexes the single socket by prompt_id to keep
            concurrent jobs isolated.
          example: abc123def4567890fedcba0987654321
        extra_data:
          type: object
          additionalProperties: true
          description: Optional. Passed through to ComfyUI's extra_data field.
        front:
          type: boolean
          description: Optional. Forwarded to ComfyUI POST /prompt queue-front flag.
        number:
          type: number
          description: Optional. Forwarded to ComfyUI POST /prompt.
        workflow_id:
          type: string
          description: >-
            Optional. When provided together with generation_id, enables
            server-side processing: the server registers a prompt_id
            subscriber on the pod's shared websocket, traces every routed
            event into the generation's sibling .log file (one log per
            prompt), and keeps the generation json updated (same file
            written by /v1/comfy/workflows/{id}/generate).
            The request returns 202 immediately — clients poll
            GET /v1/comfy/workflows/{id}/generate for progress instead of
            reading the stream.
          example: "a1b2c3d4"
        generation_id:
          type: string
          description: >-
            Generation entry id to update while processing (server-side
            processing mode only).
          example: "20260729-101530"
      required:
        - pod_url
        - prompt

    CloudStreamEvent:
      type: object
      description: >-
        One line in the application/x-ndjson stream returned by
        POST /v1/comfy/cloud/prompt. Every event is
        {"type": "<EventType>", "data": <event-specific>} on a single line,
        terminated by \n.
      properties:
        type:
          type: string
          description: >-
            Event type discriminator. Common values:
            prompt_queued, prompt_done, prompt_error, status,
            execution_start, execution_cached, progress, executing,
            executed, execution_error, execution_success,
            execution_interrupted, binary.
        data:
          type: object
          additionalProperties: true
          description: Event-specific payload. See beam_comfy_service.yaml for details.
      required:
        - type
        - data
