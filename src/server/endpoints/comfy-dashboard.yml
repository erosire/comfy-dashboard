openapi: 3.0.3
info:
  title: ComfyUI Dashboard API
  description: >-
    API for managing ComfyUI workflows, queue, and server status. Provides
    CRUD for workflows, queue management for generations, and a health/status
    endpoint for monitoring the ComfyUI server connection.
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8188
    description: Local ComfyUI server
  - url: https://comfy-spawner.beam.cloud
    description: Beam ComfyUI spawner (Tier 1 — used by /v1/comfy/cloud/create)
tags:
  - name: Workflows
    description: CRUD for ComfyUI workflows
  - name: Queue
    description: Generation queue management
  - name: Status
    description: Server status and health
  - name: Cloud
    description: Beam cloud pod management - spawn pods and submit prompts
paths:
  /v1/comfy/workflows:
    get:
      operationId: listWorkflows
      summary: List all workflows
      description: >-
        Returns stored workflow metadata, optionally filtered by search query
        (matches name, description, or tags). Each entry includes id, name,
        description, nodeCount, timestamps, and tags. Sorted by modifiedDate
        descending (most recently modified first).
      tags:
        - Workflows
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Free-text search query. Matches against workflow name, description,
            and tags (case-insensitive substring match).
          schema:
            type: string
      responses:
        '200':
          description: List of all workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
              example:
                workflows:
                  - id: wf-001
                    name: Text-to-Image Basic
                    description: Simple txt2img workflow
                    nodeCount: 8
                    createdDate: '2026-07-01T10:00:00.000Z'
                    modifiedDate: '2026-07-01T10:00:00.000Z'
                    tags: [txt2img, basic]
    post:
      operationId: createWorkflow
      summary: Create a new workflow
      description: >-
        Uploads a new ComfyUI workflow. Accepts the workflow name, optional
        description, and the raw ComfyUI workflow JSON. Extracts node
        information and stores the workflow.
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '200':
          description: Workflow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkflowResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Get a specific workflow
      description: >-
        Returns the full workflow including all nodes and the raw ComfyUI JSON.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateWorkflow
      summary: Update a workflow
      description: >-
        Partially updates an existing workflow. Accepts any combination of
        name, description, and raw workflow JSON. Only provided fields are
        updated; omitted fields retain their current values.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowRequest'
      responses:
        '200':
          description: Workflow updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow
      description: Permanently removes a workflow and all its data.
      tags:
        - Workflows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/queue:
    get:
      operationId: getQueue
      summary: Get the generation queue
      description: Returns all items currently in the generation queue.
      tags:
        - Queue
      responses:
        '200':
          description: Queue contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
    post:
      operationId: queueWorkflow
      summary: Queue a workflow for generation
      description: >-
        Adds a workflow to the generation queue. The workflow will be
        executed asynchronously.
      tags:
        - Queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueWorkflowRequest'
      responses:
        '200':
          description: Workflow queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueWorkflowResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/queue/{id}:
    delete:
      operationId: cancelQueueItem
      summary: Cancel a queue item
      description: Removes a pending or running item from the generation queue.
      tags:
        - Queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue item cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelQueueResponse'
        '404':
          description: Queue item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/status:
    get:
      operationId: getStatus
      summary: Get server status
      description: >-
        Returns the current server status including connection state, queue
        size, active jobs, uptime, and version information.
      tags:
        - Status
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'

  /v1/comfy/cloud/create:
    get:
      operationId: cloudCreate
      summary: Spawn a new ComfyUI pod on Beam
      description: >-
        Triggers the creation of a new, isolated ComfyUI pod via the Beam
        spawner (Tier 1). Returns the pod's container ID and public proxy
        URL. The pod runs ComfyUI with a FastAPI proxy on its public port
        and scales to zero ~120s after the last active connection.
      tags:
        - Cloud
      parameters:
        - name: name
          in: query
          required: false
          description: Optional name for the spawned pod.
          schema:
            type: string
      responses:
        '200':
          description: Pod created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudCreateResponse'
        '502':
          description: Spawner unavailable or pod creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/comfy/cloud/prompt:
    post:
      operationId: cloudPrompt
      summary: Send a workflow to a spawned pod and stream results
      description: >-
        Sends a ComfyUI workflow payload to a spawned pod's Tier 2 proxy
        and streams back the execution results as newline-delimited JSON
        (NDJSON). The client must read the response body as a stream,
        parsing one JSON object per line until receiving a `proxy_done`
        or terminal event.
      tags:
        - Cloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPromptRequest'
            examples:
              txt2img:
                summary: Submit a txt2img workflow
                value:
                  pod_url: "https://test-pod-abc123.beam.cloud:8188"
                  prompt:
                    "3":
                      class_type: KSampler
                      inputs:
                        seed: 123456789012345
                        steps: 20
                        cfg: 8
                        sampler_name: euler
                        scheduler: normal
                        denoise: 1
                        model: ["4", 0]
                        positive: ["6", 0]
                        negative: ["7", 0]
                        latent_image: ["5", 0]
                    "4":
                      class_type: CheckpointLoaderSimple
                      inputs:
                        ckpt_name: sd_xl_base_1.0.safetensors
                    "5":
                      class_type: EmptyLatentImage
                      inputs:
                        width: 1024
                        height: 1024
                        batch_size: 1
                    "6":
                      class_type: CLIPTextEncode
                      inputs:
                        text: "a serene mountain lake at dawn"
                        clip: ["4", 1]
                    "7":
                      class_type: CLIPTextEncode
                      inputs:
                        text: "blurry, low quality"
                        clip: ["4", 1]
                    "8":
                      class_type: VAEDecode
                      inputs:
                        samples: ["3", 0]
                        vae: ["4", 2]
                    "9":
                      class_type: SaveImage
                      inputs:
                        filename_prefix: "ComfyUI"
                        images: ["8", 0]
                  client_id: "abc123def4567890fedcba0987654321"
      responses:
        '200':
          description: >-
            Chunked NDJSON stream of execution events. Read line-by-line
            until `proxy_done` or a terminal event.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/CloudPromptStreamEvent'
        '400':
          description: Invalid request (missing pod_url or prompt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Pod unreachable or returned an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    WorkflowMeta:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        nodeCount:
          type: integer
        createdDate:
          type: string
        modifiedDate:
          type: string
        tags:
          type: array
          items:
            type: string

    Workflow:
      allOf:
        - $ref: '#/components/schemas/WorkflowMeta'
        - type: object
          properties:
            nodes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  position:
                    type: object
                    properties:
                      x:
                        type: number
                      y:
                        type: number
                  inputs:
                    type: object
            raw:
              type: object
              description: The raw ComfyUI workflow JSON

    CreateWorkflowRequest:
      type: object
      required:
        - name
        - raw
      properties:
        name:
          type: string
        description:
          type: string
        raw:
          type: object
          description: The raw ComfyUI workflow JSON

    CreateWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowMeta'

    GetWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'

    DeleteWorkflowResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: string

    UpdateWorkflowRequest:
      type: object
      description: >-
        Partial update for an existing workflow. Only include fields that
        should change; omitted fields retain their current values.
      properties:
        name:
          type: string
          description: New name for the workflow.
        description:
          type: string
          description: New description for the workflow.
        raw:
          type: object
          description: >-
            Updated raw ComfyUI workflow JSON. When provided, the node list
            and nodeCount are re-extracted from this object.
        tags:
          type: array
          items:
            type: string
          description: Replacement tag list.

    UpdateWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'

    WorkflowListResponse:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMeta'

    QueueItem:
      type: object
      properties:
        id:
          type: string
        workflowId:
          type: string
        workflowName:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        queuedAt:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
        error:
          type: string

    QueueResponse:
      type: object
      properties:
        queue:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'

    QueueWorkflowRequest:
      type: object
      required:
        - workflowId
      properties:
        workflowId:
          type: string
        params:
          type: object
          description: Optional generation parameters to override defaults

    QueueWorkflowResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string

    CancelQueueResponse:
      type: object
      properties:
        success:
          type: boolean

    ServerStatusResponse:
      type: object
      properties:
        connected:
          type: boolean
        queueSize:
          type: integer
        activeJobs:
          type: integer
        uptime:
          type: number
        version:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    CloudCreateResponse:
      type: object
      description: Response from spawning a new ComfyUI pod via Beam.
      properties:
        container_id:
          type: string
          format: uuid
          description: Beam container ID of the spawned pod.
          example: 5f8c1b2a-3d4e-4f5a-9b8c-7e6d5c4b3a2d
        pod_url:
          type: string
          format: uri
          description: >-
            Public URL of the spawned pod's Tier 2 API proxy.
            Use this URL for subsequent POST /v1/comfy/cloud/prompt calls.
          example: https://test-pod-abc123.beam.cloud:8188
      required: [container_id, pod_url]

    CloudPromptRequest:
      type: object
      description: Request body for submitting a workflow to a spawned pod.
      properties:
        pod_url:
          type: string
          format: uri
          description: The Tier 2 proxy URL of a spawned pod (from cloud/create).
          example: https://test-pod-abc123.beam.cloud:8188
        prompt:
          type: object
          additionalProperties: true
          description: >-
            The ComfyUI workflow graph, keyed by node id (string).
            Each value is {"class_type": "...", "inputs": {...}}.
          example:
            "3":
              class_type: KSampler
              inputs:
                seed: 123456789012345
                steps: 20
        client_id:
          type: string
          description: Optional client identifier for websocket event linking.
          example: abc123def4567890fedcba0987654321
      required: [pod_url, prompt]

    CloudPromptStreamEvent:
      type: object
      description: >-
        One line in the NDJSON stream returned by POST /v1/comfy/cloud/prompt.
        Every event is {"type": "<EventType>", "data": <event-specific>}.
      properties:
        type:
          type: string
          description: Event type discriminator.
        data:
          type: object
          additionalProperties: true
          description: Event-specific payload.
      required: [type, data]
